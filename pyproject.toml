[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ionbus_flapi"
version = "0.1.0"
description = "A low-code framework for building web applications with Flask/FastAPI"
readme = "readme.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Developer"}
]
keywords = [
    "flapi",
    "fastapi",
    "flask",
    "web",
    "framework",
    "low-code",
    "dashboard",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "ionbus_utils",
    "fastapi>=0.100.0",
    "flask>=3.0.0",
    "uvicorn>=0.20.0",
    "waitress>=2.0.0",
    "pandas>=1.5.0",
    "plotly>=5.0.0",
    "markdown>=3.0.0",
    "pyyaml>=6.0.0",
    "python-multipart>=0.0.6",
    "pydantic-settings>=2.0.0",
    "starlette>=0.27.0",
]

[project.optional-dependencies]
dash = [
    "dash>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "ipython>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/ionbus/ionbus_flapi"
Documentation = "https://github.com/ionbus/ionbus_flapi#readme"
Repository = "https://github.com/ionbus/ionbus_flapi"

[tool.setuptools.packages.find]
where = ["."]
include = ["ionbus_flapi*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
ionbus_flapi = ["py.typed"]

[tool.black]
line-length = 78
target-version = ["py39"]

[tool.ruff]
line-length = 78
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "PL",  # pylint
]
ignore = [
    "E501",   # line too long (handled by black)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "C901",   # too complex
]

[tool.ruff.isort]
known-first-party = ["ionbus_flapi", "ionbus_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
