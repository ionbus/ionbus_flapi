[build-system]
requires = ["setuptools==71.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ionbus-flapi"
authors = [
  { name = "Charles Lewis", email = "dev@ionbus.info" },
]
description = "A low-code framework for building web applications with Flask and FastAPI"
license = "MIT"
readme = "readme.md"
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Framework :: Flask",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["dependencies", "version"]

[project.optional-dependencies]
test = [
  "pytest>=7.0.0",
]
dev = [
  "pytest>=7.0.0",
  "black>=23.0.0",
  "build>=1.0.0",
  "ruff>=0.1.0",
  "twine>=5.0.0",
  "ipython>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/ionbus/ionbus_flapi"
Repository = "https://github.com/ionbus/ionbus_flapi"
PyPI = "https://pypi.org/project/ionbus-flapi/"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.black]
line-length = 78
target-version = ["py39"]

[tool.ruff]
line-length = 78
target-version = "py39"
select = [
  "E",
  "W",
  "F",
  "I",
  "C",
  "B",
  "UP",
  "PL",
]
ignore = [
  "E501",
  "PLR0913",
  "PLR2004",
  "C901",
]

[tool.ruff.isort]
known-first-party = ["ionbus_flapi", "ionbus_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
